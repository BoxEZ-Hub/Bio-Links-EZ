<style>
:root{--bg:#030a1c;--panel:#071a4a;--line:#1f6bff;--cy:#22d3ee;--tx:#eaf2ff;--mut:#9db8e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#0a1f55 0%,var(--bg) 60%) var(--bg);color:var(--tx);font-family:"Poppins","Segoe UI",system-ui,sans-serif;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:170px;height:170px;border-radius:32px;background:linear-gradient(135deg,#1f6bff,#0a2a9c);opacity:.75;pointer-events:none;z-index:0}
body::before{top:-90px;left:-70px;transform:rotate(45deg)}
body::after{bottom:-100px;right:-70px;transform:rotate(45deg)}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:36px 20px 50px;text-align:center}
.logo{width:112px;height:112px;margin:0 auto 10px;filter:drop-shadow(0 0 14px rgba(31,107,255,.8))}
.word{margin:0;font-size:54px;font-weight:800;font-style:italic;letter-spacing:-2px;line-height:1.05}
.word em{background:linear-gradient(90deg,#22d3ee,#1f6bff);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:6px}
.tag{margin:6px 0 18px;font-size:17px;letter-spacing:.06em}
.chips{display:flex;justify-content:center;align-items:center;margin-bottom:22px;font-size:13px;color:#7fb0ff}
.chips span{display:flex;align-items:center;gap:6px;padding:0 12px}
.chips span+span{border-left:1px solid rgba(127,176,255,.3)}
.chips svg{width:18px;height:18px;stroke:#3b82ff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.back{display:inline-block;margin:6px 0 10px;padding:6px 14px;font-size:13px;color:var(--cy);text-decoration:none;border:1px solid rgba(34,211,238,.4);border-radius:999px}
.back:hover,.back:focus-visible{background:rgba(34,211,238,.12);outline:none}
#head h2{margin:6px 0 4px;font-size:24px;font-weight:800}
.catd{margin:0 0 16px;font-size:13px;color:var(--mut)}
#list{display:grid;gap:14px;margin-top:6px}
.btn{display:flex;align-items:center;gap:14px;padding:13px 16px;text-align:left;text-decoration:none;color:inherit;border:1.5px solid var(--line);border-radius:22px;background:linear-gradient(135deg,rgba(16,56,160,.55),rgba(5,16,50,.9));box-shadow:0 0 16px rgba(31,107,255,.3),inset 0 0 22px rgba(31,107,255,.12);transition:transform .15s,box-shadow .15s}
a.btn:hover,a.btn:focus-visible{transform:translateY(-2px);box-shadow:0 0 26px rgba(34,211,238,.45),inset 0 0 22px rgba(31,107,255,.2);outline:none}
.btn.soon{opacity:.6}
.ic{flex:none;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#1f6bff,#1446d8)}
.ic.c{background:linear-gradient(135deg,#22d3ee,#0ea5e9)}
.ic.im{background:#fff;overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover;display:block}
.ic svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tx{display:flex;flex-direction:column;min-width:0;gap:2px}
.tt{font-size:15px;font-weight:700;letter-spacing:.04em;overflow-wrap:anywhere}
.ds{font-size:13px;color:var(--mut)}
.ch{margin-left:auto;font-size:30px;line-height:1;color:#4f9bff}
.badge{margin-left:auto;flex:none;font-size:11px;color:#fbbf24;border:1px solid rgba(251,191,36,.5);border-radius:999px;padding:3px 9px}
.empty,.err{margin:10px 0;font-size:14px;color:var(--mut)}
.err{padding:14px;color:#fecaca;border:1px solid #f87171;border-radius:14px;background:rgba(127,29,29,.3)}
#soc{display:flex;justify-content:center;align-items:flex-start;margin:28px 0 18px}
.so{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;color:var(--tx);text-decoration:none;font-size:13px}
.so small{font-size:11px;color:var(--mut)}
.ring{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;margin-bottom:4px}
.ring svg{width:26px;height:26px;stroke:var(--cy);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sep{width:1px;align-self:stretch;background:rgba(127,176,255,.25)}
.foot{margin:0;font-size:13px;color:var(--mut)}
.foot b{color:var(--tx)}
.disc{margin:14px auto 0;max-width:340px;font-size:11px;line-height:1.5;color:#6f8ac4}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D;
try{D=JSON.parse($('#data').textContent)}catch(e){
  $('#list').innerHTML='<p class="err"><b>Erro nos dados da página.</b><br>Confira vírgulas, aspas e chaves no bloco de dados.<br><small>'+esc(e.message)+'</small></p>';
  throw e;
}
const I={
cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/>',
flame:'<path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/>',
star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
box:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/>',
chat:'<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/>',
bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
tag:'<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.3"/>',
link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/>',
home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',
instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8"/>',
whatsapp:'<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/><path d="M9 9c0 3 3 6 6 6l1-2-2-1-1 .5c-.8-.4-1.6-1.2-2-2l.5-1-1-2z"/>',
tiktok:'<path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.3 2.4 2 4 4.5 4.2"/>'
};
const ico=n=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(I[n]||I.link)+'</svg>';
const slug=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
function safeUrl(u){u=(u||'').trim();if(!u||u==='#')return'#';if(/^https?:\/\//i.test(u))return u;if(/^[a-z][a-z0-9+.-]*:/i.test(u))return'#';return'https://'+u}
function current(){const h=slug(decodeURIComponent(location.hash.slice(1)));return h?(D.categories||[]).find(c=>slug(c.name)===h)||null:null}
function tile(o,title,sub,href,ext){
  const ok=href&&href!=='#';
  const pic=o.img?'<img src="'+esc(o.img)+'" alt="" loading="lazy">':ico(o.icon);
  const inner='<span class="ic'+(o.c?' c':'')+(o.img?' im':'')+'">'+pic+'</span><span class="tx"><b class="tt">'+esc(title)+'</b><span class="ds">'+esc(sub)+'</span></span>'+(ok?'<span class="ch">›</span>':'<span class="badge">em breve</span>');
  return ok?'<a class="btn" href="'+esc(href)+'"'+(ext?' target="_blank" rel="noopener sponsored nofollow"':'')+'>'+inner+'</a>':'<div class="btn soon">'+inner+'</div>';
}
function render(){
  const cat=current(),cats=D.categories||[];
  $('#tag').textContent=D.tagline||'';
  $('#tag').hidden=!!cat;
  $('#chips').hidden=!!cat;
  $('#chips').innerHTML=[['bolt','Tecnologia'],['box','Utilidades'],['star','Inovação']].map(a=>'<span>'+ico(a[0])+a[1]+'</span>').join('');
  document.title=cat?cat.name+' | BoxEZ':'BoxEZ | Seu hub de soluções fáceis';
  if(!cat){
    $('#head').innerHTML='';
    $('#list').innerHTML=cats.map(c=>{const n=(c.links||[]).length;return tile(c,c.name,c.desc||(n+(n===1?' oferta':' ofertas')),'#'+slug(c.name),false)}).join('')||'<p class="empty">Nenhuma categoria ainda.</p>';
  }else{
    $('#head').innerHTML='<a class="back" href="#">‹ Todas as categorias</a><h2>'+esc(cat.name)+'</h2>'+(cat.desc?'<p class="catd">'+esc(cat.desc)+'</p>':'');
    $('#list').innerHTML=(cat.links||[]).map(l=>tile(l,l.title,l.desc,safeUrl(l.url),true)).join('')||'<p class="empty">Em breve, novos achados aqui.</p>';
  }
  const S=D.social||{};
  $('#soc').innerHTML=[['instagram','Instagram'],['whatsapp','WhatsApp'],['tiktok','TikTok']].filter(s=>S[s[0]]&&S[s[0]].url).map(s=>'<a class="so" href="'+esc(safeUrl(S[s[0]].url))+'" target="_blank" rel="noopener"><span class="ring">'+ico(s[0])+'</span><b>'+s[1]+'</b><small>'+esc(S[s[0]].label)+'</small></a>').join('<i class="sep"></i>');
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
render();
</script>
